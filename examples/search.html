<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search example · Pulsar JSON Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script><link rel="stylesheet" href="../src/pulsar-json-viewer.css">
</head>
<body class="m-0 min-h-screen bg-slate-50 text-slate-950 antialiased">
<header class="border-b border-slate-200 bg-white"><div class="mx-auto w-full max-w-7xl px-5 py-8 sm:px-6 lg:px-8 lg:py-10"><a class="inline-flex min-h-10 items-center rounded-lg px-3 text-sm font-semibold text-sky-800 no-underline transition hover:bg-sky-50 hover:text-sky-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-700 focus-visible:ring-offset-2" href="index.html">← Examples</a><h1 class="mt-5 text-3xl font-bold tracking-tight text-slate-950 sm:text-4xl">Search a JSON payload</h1><p class="mt-3 max-w-4xl text-base leading-7 text-slate-600">Try <code>PRODUCTION</code>, <code>payment</code>, <code>2.1</code> or <code>degraded</code>. Search starts while you type and is always case insensitive. Enter restarts at the first match. Use the dedicated Previous and Next buttons to move between results.</p></div></header>
<main class="mx-auto w-full max-w-7xl px-5 py-8 sm:px-6 lg:px-8 lg:py-10"><div class="overflow-hidden rounded-xl bg-white shadow-lg ring-1 ring-slate-200"><pulsar-json-viewer id="viewer"></pulsar-json-viewer></div></main>
<script src="https://unpkg.com/@alenaksu/json-viewer@2.1.2/dist/json-viewer.bundle.js"></script>
<script src="../src/selection-model.js"></script><script src="../src/pulsar-json-viewer.js"></script>
<script>
const viewer = document.querySelector('#viewer')
viewer.data = { environment: 'production', services: { catalog: { status: 'healthy', owner: 'commerce' }, payment: { status: 'degraded', owner: 'fintech', incident: 'INC-4821' }, search: { status: 'healthy', owner: 'discovery' } }, deployment: { release: '2026.09.6', strategy: 'canary' } }
</script>
</body></html>
