<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Array example · Pulsar JSON Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script><link rel="stylesheet" href="../src/pulsar-json-viewer.css">
</head>
<body class="m-0 min-h-screen bg-slate-50 text-slate-950 antialiased">
<header class="border-b border-slate-200 bg-white"><div class="mx-auto w-full max-w-7xl px-5 py-8 sm:px-6 lg:px-8 lg:py-10"><a class="inline-flex min-h-10 items-center rounded-lg px-3 text-sm font-semibold text-sky-800 no-underline transition hover:bg-sky-50 hover:text-sky-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-700 focus-visible:ring-offset-2" href="index.html">← Examples</a><h1 class="mt-5 text-3xl font-bold tracking-tight text-slate-950 sm:text-4xl">Arrays and mixed selection</h1><p class="mt-3 max-w-4xl text-base leading-7 text-slate-600">Select one field from one deployment, then inspect the mixed state on the parent array and object.</p></div></header>
<main class="mx-auto w-full max-w-7xl px-5 py-8 sm:px-6 lg:px-8 lg:py-10"><div class="overflow-hidden rounded-xl bg-white shadow-lg ring-1 ring-slate-200"><pulsar-json-viewer id="viewer" download-name="deployment-selection.json"></pulsar-json-viewer></div></main>
<script src="https://unpkg.com/@alenaksu/json-viewer@2.1.2/dist/json-viewer.bundle.js"></script>
<script src="../src/selection-model.js"></script><script src="../src/pulsar-json-viewer.js"></script>
<script>
const viewer = document.querySelector('#viewer')
viewer.data = { deployments: [ { id: 'dep-1042', service: 'checkout', version: '7.8.1', regions: ['us-east-1', 'eu-west-1'], healthy: true }, { id: 'dep-1043', service: 'payment', version: '5.14.0', regions: ['us-east-1'], healthy: false }, { id: 'dep-1044', service: 'catalog', version: '12.3.7', regions: ['ap-southeast-1', 'eu-west-1'], healthy: true } ] }
</script>
</body></html>
