<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selection example · Pulsar JSON Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script><link rel="stylesheet" href="../src/pulsar-json-viewer.css">
</head>
<body class="m-0 min-h-screen bg-slate-50 text-slate-950 antialiased">
<header class="border-b border-slate-200 bg-white"><div class="mx-auto w-full max-w-7xl px-5 py-8 sm:px-6 lg:px-8 lg:py-10"><a class="inline-flex min-h-10 items-center rounded-lg px-3 text-sm font-semibold text-sky-800 no-underline transition hover:bg-sky-50 hover:text-sky-950 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-700 focus-visible:ring-offset-2" href="index.html">← Examples</a><h1 class="mt-5 text-3xl font-bold tracking-tight text-slate-950 sm:text-4xl">Nested checkbox selection</h1><p class="mt-3 max-w-4xl text-base leading-7 text-slate-600">Select a leaf or an entire branch. The panel below mirrors the data emitted by <code>selectionchange</code>.</p></div></header>
<main class="mx-auto w-full max-w-7xl px-5 py-8 sm:px-6 lg:px-8 lg:py-10"><div class="grid gap-4 lg:grid-cols-[1.15fr_.85fr]"><div class="overflow-hidden rounded-xl bg-white shadow-lg ring-1 ring-slate-200"><pulsar-json-viewer id="viewer"></pulsar-json-viewer></div><aside class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm"><h2 class="text-lg font-bold tracking-tight text-slate-950">Selected JSON</h2><p class="mt-1 text-sm leading-6 text-slate-600">This is the exact subset currently selected in the tree.</p><pre id="output" class="mt-4 min-h-16 overflow-auto whitespace-pre-wrap rounded-lg bg-slate-950 p-4 font-mono text-sm text-slate-100">Nothing selected</pre></aside></div></main>
<script src="https://unpkg.com/@alenaksu/json-viewer@2.1.2/dist/json-viewer.bundle.js"></script>
<script src="../src/selection-model.js"></script><script src="../src/pulsar-json-viewer.js"></script>
<script>
const viewer = document.querySelector('#viewer')
const output = document.querySelector('#output')
viewer.data = { account: { id: 'acc_7812', plan: 'enterprise', owner: { name: 'Mira Chen', team: 'Platform' } }, permissions: { read: true, write: true, billing: false }, regions: ['us-east-1', 'eu-west-1'] }
viewer.addEventListener('selectionchange', event => { output.textContent = event.detail.selectedData === undefined ? 'Nothing selected' : JSON.stringify(event.detail.selectedData, null, 2) })
</script>
</body></html>
